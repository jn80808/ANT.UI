
<div class="container">
    <h1 class="mt-3">Category List</h1>

     <!-- Create Category Button  -->
    <div class="d-flex justify-content-end mt-3">
        <a
            [routerLink]="['/admin', 'categories', 'add']"
            class="btn btn-primary">
            Create Category
        </a>
    </div>

    <div class="mt-3">
        <!-- Category list will go here -->
    </div>

    <!-- loading idicator before show the table  -->
    <div>
        @if (isLoading()){
            <p>Loading...</p>
        }@else {
            @if (isError()){
                <p>There has been an error...</p>
            } @else{
                @for (category of value (); track category.id){
                    <p>{{category.id}}</p>
                }
            }
        }
    </div>








</div>
